name: Daily Auto Publish WIB

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB
    - cron: "0 4 * * *"   # 11:00 WIB
    - cron: "0 8 * * *"   # 15:00 WIB
    - cron: "0 12 * * *"  # 19:00 WIB
  workflow_dispatch:

jobs:
  trigger-daily-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call DENJEH AI Daily Publish Endpoint
        run: |
          BODY_FILE=$(mktemp)
          CODE=$(curl -s -o "$BODY_FILE" -w "%{http_code}" -X POST \
            "https://denjeh-ai.adeni9294.workers.dev/api/cron/daily-publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP Status: $CODE"
          cat "$BODY_FILE"
          echo ""
          test "$CODE" -ge 200 -a "$CODE" -lt 300
